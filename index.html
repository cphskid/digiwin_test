<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銅期貨 (HG) 價格趨勢圖</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #f5f9fc;
    --card-bg: #ffffff;
    --card-shadow: rgba(0,0,0,0.08);
    --text: #1a2b3c;
    --title: #0d3b66;
    --subtitle: #6b7c93;
    --btn-bg: #eaf3fb;
    --btn-border: #bcd9f0;
    --btn-text: #0d5c9e;
    --btn-active-bg: #0d5c9e;
    --btn-active-text: #ffffff;
    --footer-text: #9aa8b8;
    --footer-border: #eef2f6;
    --plot-bg: #ffffff;
    --grid: #f0f4f8;
    --up-color: #3ea6ff;
    --down-color: #a8c8e8;
    --toggle-bg: #eaf3fb;
    --toggle-border: #bcd9f0;
    --toggle-text: #0d5c9e;
  }

  html[data-theme="dark-gold"] {
    --bg: #0f1115;
    --card-bg: #17191f;
    --card-shadow: rgba(0,0,0,0.5);
    --text: #e8dfc8;
    --title: #d4af37;
    --subtitle: #a89968;
    --btn-bg: #22242b;
    --btn-border: #4a3f24;
    --btn-text: #d4af37;
    --btn-active-bg: #d4af37;
    --btn-active-text: #14151a;
    --footer-text: #7a7460;
    --footer-border: #2a2c33;
    --plot-bg: #17191f;
    --grid: #2a2c33;
    --up-color: #d4af37;
    --down-color: #6b5d33;
    --toggle-bg: #22242b;
    --toggle-border: #4a3f24;
    --toggle-text: #d4af37;
  }

  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 24px;
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 2px 12px var(--card-shadow);
    padding: 24px 32px 32px;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  h1 {
    font-size: 22px;
    color: var(--title);
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--subtitle);
    margin-bottom: 20px;
  }
  .theme-switch {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .theme-switch button {
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    color: var(--toggle-text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .theme-switch button.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls button {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .controls button:hover, .controls button.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }
  #chart {
    width: 100%;
    height: 560px;
  }
  .footer-note {
    font-size: 12px;
    color: var(--footer-text);
    margin-top: 16px;
    border-top: 1px solid var(--footer-border);
    padding-top: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <div>
      <h1>銅期貨 (Databento HG.c.0 連續合約) 價格趨勢圖</h1>
      <div class="subtitle">日線 OHLC，可用下方按鈕或圖表下方拖曳軸自訂顯示區間</div>
    </div>
    <div class="theme-switch">
      <button id="themeLight" class="active">淺色</button>
      <button id="themeDark">深色金</button>
    </div>
  </div>

  <div class="controls">
    <button data-range="7">近1週</button>
    <button data-range="14">近2週</button>
    <button data-range="30" class="active">近1個月</button>
    <button data-range="all">全部</button>
  </div>

  <div id="chart"></div>

  <div class="footer-note">
    資料來源：Databento (dataset: GLBX.MDP3, symbol: HG.c.0 連續合約，美分/磅)。資料區間：<span id="dateRangeLabel"></span>。
  </div>
</div>

<script>
const rawData = __DATA_JSON__;

const dates = rawData.map(d => d.date);
const opens = rawData.map(d => d.open);
const highs = rawData.map(d => d.high);
const lows = rawData.map(d => d.low);
const closes = rawData.map(d => d.close);

document.getElementById('dateRangeLabel').textContent = dates[0] + ' ~ ' + dates[dates.length - 1];

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function buildTrace() {
  return {
    x: dates,
    open: opens,
    high: highs,
    low: lows,
    close: closes,
    type: 'candlestick',
    increasing: {line: {color: cssVar('--up-color')}, fillcolor: cssVar('--up-color')},
    decreasing: {line: {color: cssVar('--down-color')}, fillcolor: cssVar('--down-color')},
    name: '銅 HG'
  };
}

function buildLayout() {
  return {
    margin: {t: 20, r: 30, l: 50, b: 40},
    xaxis: {
      rangeslider: {visible: true, thickness: 0.08, bgcolor: cssVar('--btn-bg')},
      type: 'date',
      gridcolor: cssVar('--grid'),
      color: cssVar('--text')
    },
    yaxis: {
      title: '美分/磅',
      gridcolor: cssVar('--grid'),
      color: cssVar('--text')
    },
    plot_bgcolor: cssVar('--plot-bg'),
    paper_bgcolor: cssVar('--plot-bg'),
    font: {family: 'Noto Sans TC, Microsoft JhengHei, sans-serif', color: cssVar('--text')}
  };
}

Plotly.newPlot('chart', [buildTrace()], buildLayout(), {responsive: true, displaylogo: false});

function setRange(days) {
  if (days === 'all') {
    Plotly.relayout('chart', {'xaxis.autorange': true});
  } else {
    const lastDate = new Date(dates[dates.length - 1]);
    const startDate = new Date(lastDate);
    startDate.setDate(startDate.getDate() - days);
    Plotly.relayout('chart', {
      'xaxis.range': [startDate.toISOString().slice(0,10), dates[dates.length - 1]]
    });
  }
}

document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const val = btn.getAttribute('data-range');
    setRange(val === 'all' ? 'all' : parseInt(val, 10));
  });
});

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeLight').classList.toggle('active', theme === 'light');
  document.getElementById('themeDark').classList.toggle('active', theme === 'dark-gold');
  localStorage.setItem('copperChartTheme', theme);
  Plotly.react('chart', [buildTrace()], buildLayout(), {responsive: true, displaylogo: false});
}

document.getElementById('themeLight').addEventListener('click', () => applyTheme('light'));
document.getElementById('themeDark').addEventListener('click', () => applyTheme('dark-gold'));

const savedTheme = localStorage.getItem('copperChartTheme');
if (savedTheme === 'dark-gold') {
  applyTheme('dark-gold');
}
</script>
</body>
</html>
